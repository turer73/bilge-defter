name: Reliability candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reconstruct historical packages and immutable v74/v75/v76 baselines.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: python -m pip install -r server-candidate/v49/requirements.txt pytest
      - run: npm run build
      - run: npm run prepare:baselines
      - name: Prepare historical and actual published v76 baselines
        run: |
          node work/prepare-v64-baseline.cjs
          node work/prepare-v65-baseline.cjs
          node work/prepare-v66-baseline.cjs
          node work/prepare-v67-baseline.cjs
          node work/prepare-v68-baseline.cjs
          node work/prepare-v69-baseline.cjs
          node work/prepare-v70-baseline.cjs
          node work/prepare-v71-baseline.cjs
          node work/prepare-v72-baseline.cjs
          npm run prepare:compat-reader
      - name: Historical behavior against current v77, updates from actual v76
        run: node work/verify-v77.cjs
      - run: npm run test:reliability
      - run: npm run test:presentations
      - run: npm run test:page-limit
      - run: node work/verify-page-limit-sw.cjs
      - run: npm run check:pptx-pilot
      - run: npm run test:pptx-store
      - run: npm run test:pptx-races
      - name: Native PPTX account, notebook, backup and offline integration (synthetic only)
        run: npm run test:pptx-integration
      - name: Ordinary notebook PPTX imports, UI and guarded storage (synthetic only)
        run: node work/verify-pptx-notebook.cjs
        env:
          BILGE_TEST_ROOT: ${{ github.workspace }}/work/bilge-defter-invited-v77
      - name: Native raster safety and image readiness (synthetic only)
        run: node work/verify-pptx-raster.cjs
      - name: Real published v76 reader accepts v77 notebook pages (synthetic only)
        run: node work/verify-pptx-notebook-compat.cjs
      - run: python -m pytest server-candidate/v49/tests -q
      - run: python -m pytest worker -q
      - run: python -B work/test_deploy_v73.py
      - run: python -B work/test_deploy_v75.py
      - run: python -B work/test_deploy_v76.py
      - run: python -B work/test_deploy_v77.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-reliability-evidence
          path: |
            outputs/reliability-1/
            outputs/presentations/
            outputs/page-limit/
            outputs/page-limit-sw/
            outputs/v77/
            outputs/pptx-v77-release/integration-*.json
            outputs/pptx-v77-release/*native-pptx-ready.png
            outputs/pptx-v77-release/v76-baseline/build-proof.json
            outputs/pptx-notebook/
            outputs/pptx-v77-release/notebook-compat/
            outputs/pptx-v76-release/raster-probe/
          retention-days: 7
# No secrets, live accounts, deployment, self-hosted runner or paid API.
# This supplements (does not replace) the historical release/device test matrix.
