server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "private, no-store, no-transform" always;
  location = / { try_files /index.html =404; }
  location /api/v1/bilge-defter/ {
    proxy_pass http://172.17.0.1:8420;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location ~ ^/(index\.html|ui-workspace\.js|ui\.css|release\.json|media-workspace\.js|planner-workspace\.js|pdf-workspace\.js|pwa\.js|sync-workspace\.js|dictionary-data\.js|dictionary-workspace\.js|sw\.js|manifest\.webmanifest|offline-assets\.json|THIRD_PARTY\.md)$ { try_files $uri =404; }
  location /icons/ { try_files $uri =404; }
  location /vendor/pdfjs/ { try_files $uri =404; }
  location / { return 404; }
}
