limit_req_zone $server_name zone=classroom_requests:1m rate=100r/s;
limit_req_zone $http_cf_connecting_ip zone=classroom_admin:1m rate=2r/s;
server {
  listen 80;
  server_name defter.bilgearena.com;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "private, no-store, no-transform" always;
  location = / { try_files /index.html =404; }
  # Protected by the existing Access application; never bypass its policy.
  # Top-level navigation refreshes the cookie, then returns to the account gate.
  location = /auth-continue.html { try_files $uri =404; }
  location = /auth-continue.js { try_files $uri =404; }
  location /api/v1/bilge-defter/admin/ {
    limit_req zone=classroom_admin burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://bilge-defter-accounts:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 150s;
    proxy_http_version 1.1;
  }
  location /api/v1/bilge-defter/ {
    limit_req zone=classroom_requests burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://bilge-defter-accounts:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 150s;
    proxy_http_version 1.1;
  }
  location ~ ^/(index\.html|account-workspace\.js|account\.css|ui-workspace\.js|ui\.css|release\.json|media-workspace\.js|planner-workspace\.js|pdf-workspace\.js|pwa\.js|sync-workspace\.js|dictionary-data\.js|dictionary-workspace\.js|ocr-workspace\.js|sw\.js|manifest\.webmanifest|offline-assets\.json|THIRD_PARTY\.md|button-theme\.css|button-theme\.js|button-theme-workspace\.js|ui-v2/[a-z0-9-]+\.js)$ { try_files $uri =404; }
  location /icons/ { try_files $uri =404; }
  location /vendor/pdfjs/ { try_files $uri =404; }
  location / { return 404; }
}
